name: Build and Release Module

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Module Info
        id: mod_info
        run: |
          # استخراج البيانات من module.prop تلقائياً
          MOD_ID=$(grep '^id=' module.prop | cut -d'=' -f2)
          MOD_NAME=$(grep '^name=' module.prop | cut -d'=' -f2-)
          MOD_VER=$(grep '^version=' module.prop | cut -d'=' -f2)
          
          # إعطاء قيمة افتراضية إذا لم يتم العثور عليها
          MOD_ID=${MOD_ID:-"Thermal-Manager"}
          MOD_VER=${MOD_VER:-"v1.0"}
          
          # إنشاء وسم فريد لتجنب خطأ التعديل على الإصدارات المغلقة
          TAG_NAME="${MOD_VER}-b${{ github.run_number }}"
          ZIP_NAME="${MOD_ID}-${MOD_VER}-b${{ github.run_number }}.zip"
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${MOD_NAME} (${MOD_VER} Build ${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Package Module ZIP
        run: |
          # ضغط الملفات المطلوبة فقط وتجاهل ملفات Git
          zip -r9 "${{ steps.mod_info.outputs.zip_name }}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mod_info.outputs.tag_name }}
          name: ${{ steps.mod_info.outputs.release_name }}
          body: |
            ### 🚀 Automatic Release
            - **الإصدار:** `${{ steps.mod_info.outputs.tag_name }}`
            - **رقم البناء:** `${{ github.run_number }}`
            - **التاريخ:** `${{ github.event.head_commit.timestamp }}`
            - متوافق للتفليش عبر: **KernelSU / APatch / Magisk**
          files: ${{ steps.mod_info.outputs.zip_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
